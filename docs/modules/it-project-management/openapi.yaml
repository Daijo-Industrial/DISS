        health_status_label:
          type: string
          example: On Track
        start_date:
          type: string
          format: date
          nullable: true
          example: '2026-10-15'
        original_due_date:
          type: string
          format: date
          example: '2026-12-31'
        due_date:
          type: string
          format: date
          example: '2026-12-31'
        finished_date:
