openapi: 3.0.3
info:
  title: DISS IT Project & KPI Management REST API
  description: Headless, API-first module in Daijo Industrial Support System (DISS)
    for IT project lifecycle management, dual SLA metrics, verifiable checkpoint evidence,
    and executive dashboards.
  version: 1.0.0
  contact:
    name: IT Department - Daijo Industrial
    email: raymondlay023@gmail.com
servers:
- url: http://localhost/api/v1
  description: Local Laravel Sail / Nginx Server
- url: http://127.0.0.1:8000/api/v1
  description: Local Artisan Serve
- url: http://localhost:3000/api/v1
  description: Bruno Local Mock Server
tags:
- name: Auth
  description: Sanctum Token Authentication & Profile
- name: Dashboard
  description: Aggregated KPI Cards, Dual SLA Metrics & Leaderboards
- name: Projects
  description: Project Master CRUD & Composite Queries
- name: Workflow
  description: State Machine Transitions, Hold, Resume, and Closure Gates
- name: Checkpoints
  description: Verifiable Milestone Checkpoints & File Evidence
- name: Extensions
  description: Governed Schedule Deadline Extensions
security:
- BearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Authenticate user & obtain Sanctum Bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: raymondlay023@gmail.com
                password:
                  type: string
                  format: password
                  example: Secret123!
                device_name:
                  type: string
                  example: bruno-client
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: Login successful
                data:
                  token: 1|sanctum_mock_token_abc123xyz789
                  token_type: Bearer
                  user:
                    id: 1
                    name: Raymond Lay
                    email: raymondlay023@gmail.com
                    employee_id: EMP-001
                    department:
                      id: 1
                      name: Information Technology
                      code: IT
                    roles:
                    - IT Head
                    - Admin
        '422':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: The provided credentials are incorrect.
                errors:
                  email:
                  - The provided credentials are incorrect.
  /auth/me:
    get:
      tags:
      - Auth
      summary: Get authenticated user profile and roles
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: User profile retrieved successfully
                data:
                  id: 1
                  name: Raymond Lay
                  email: raymondlay023@gmail.com
                  employee_id: EMP-001
                  department:
                    id: 1
                    name: Information Technology
                    code: IT
                  roles:
                  - IT Head
                  - Admin
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke current access token
      responses:
        '200':
          description: Token revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: Successfully logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/dashboard/summary:
    get:
      tags:
      - Dashboard
      summary: Get executive dashboard KPI summary cards (Dual SLA, counts, health)
      parameters:
      - name: department_id
        in: query
        schema:
          type: integer
        description: Filter by requester department ID
      - name: primary_pic_id
        in: query
        schema:
          type: integer
        description: Filter by primary PIC user ID
      - name: priority
        in: query
        schema:
          $ref: '#/components/schemas/ProjectPriority'
      - name: from_date
        in: query
        schema:
          type: string
          format: date
      - name: to_date
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Aggregated KPI summary metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: KPI summary retrieved successfully
                data:
                  total_projects: 24
                  active_projects: 14
                  on_hold_projects: 2
                  cancelled_projects: 1
                  completed_projects: 7
                  health_breakdown:
                    on_track: 10
                    at_risk: 3
                    overdue: 1
                  dual_sla:
                    original_sla_rate: 85.71
                    original_sla_on_time_count: 6
                    revised_schedule_rate: 100.0
                    revised_schedule_on_time_count: 7
                  governance:
                    cancellation_rate: 4.17
                    total_extensions: 5
                    average_extensions_per_project: 0.21
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/dashboard/stage-distribution:
    get:
      tags:
      - Dashboard
      summary: Get distribution count of projects across lifecycle stages
      parameters:
      - name: department_id
        in: query
        schema:
          type: integer
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ProjectStatus'
      responses:
        '200':
          description: Project counts per stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: Stage distribution retrieved successfully
                data:
                  DRAFT: 2
                  INITIATION: 3
                  PLANNING: 4
                  DEVELOPMENT: 7
                  MONITORING: 3
                  REVIEW: 2
                  CLOSURE: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/dashboard/pic-leaderboard:
    get:
      tags:
      - Dashboard
      summary: Get PIC leaderboard ranking with individual SLA metrics
      parameters:
      - name: department_id
        in: query
        schema:
          type: integer
      - name: from_date
        in: query
        schema:
          type: string
          format: date
      - name: to_date
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: PIC leaderboard ranking list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: PIC leaderboard retrieved successfully
                data:
                - pic:
                    id: 1
                    name: Raymond Lay
                    email: raymondlay023@gmail.com
                    employee_id: EMP-001
                  total_projects: 12
                  active_projects: 7
                  completed_projects: 5
                  overdue_active_projects: 0
                  original_on_time_count: 4
                  revised_on_time_count: 5
                  original_sla_rate: 80.0
                  revised_schedule_rate: 100.0
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/dashboard/upcoming-deadlines:
    get:
      tags:
      - Dashboard
      summary: Get active projects approaching deadlines within window
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          default: 30
        description: Lookahead days window
      responses:
        '200':
          description: List of upcoming deadline projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: Upcoming deadlines retrieved successfully
                data:
                - id: a2f66269-31f8-4867-b748-bbac05ddfa18
                  project_code: IT-2026-0001
                  name: MES Machine Telemetry v2
                  description: Integration of factory floor PLC machines to DISS real-time
                    telemetry dashboard.
                  priority: HIGH
                  stage: DEVELOPMENT
                  status: ACTIVE
                  health_status: ON_TRACK
                  health_status_label: On Track
                  start_date: '2026-10-15'
                  original_due_date: '2026-12-31'
                  due_date: '2026-12-31'
                  finished_date: null
                  progress_percent: 65.5
                  deadline_extension_count: 0
                  requester_name: Pak Budi
                  department:
                    id: 2
                    name: Molding Production
                    code: MOLD
                  pic:
                    id: 1
                    name: Raymond Lay
                    email: raymondlay023@gmail.com
                    employee_id: EMP-001
                  created_at: '2026-10-14T08:00:00Z'
                  updated_at: '2026-10-14T09:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects:
    get:
      tags:
      - Projects
      summary: List paginated projects with filters
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 15
      - name: stage
        in: query
        schema:
          $ref: '#/components/schemas/ProjectStage'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ProjectStatus'
      - name: priority
        in: query
        schema:
          $ref: '#/components/schemas/ProjectPriority'
      - name: department_id
        in: query
        schema:
          type: integer
      - name: pic_id
        in: query
        schema:
          type: integer
      - name: search
        in: query
        schema:
          type: string
        description: Search code, name, description
      responses:
        '200':
          description: Paginated projects response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectResource'
                  links:
                    type: object
                  meta:
                    type: object
              example:
                data:
                - id: a2f66269-31f8-4867-b748-bbac05ddfa18
                  project_code: IT-2026-0001
                  name: MES Machine Telemetry v2
                  description: Integration of factory floor PLC machines to DISS real-time
                    telemetry dashboard.
                  priority: HIGH
                  stage: DEVELOPMENT
                  status: ACTIVE
                  health_status: ON_TRACK
                  health_status_label: On Track
                  start_date: '2026-10-15'
                  original_due_date: '2026-12-31'
                  due_date: '2026-12-31'
                  finished_date: null
                  progress_percent: 65.5
                  deadline_extension_count: 0
                  requester_name: Pak Budi
                  department:
                    id: 2
                    name: Molding Production
                    code: MOLD
                  pic:
                    id: 1
                    name: Raymond Lay
                    email: raymondlay023@gmail.com
                    employee_id: EMP-001
                  created_at: '2026-10-14T08:00:00Z'
                  updated_at: '2026-10-14T09:30:00Z'
                links:
                  first: http://localhost/api/v1/projects?page=1
                  last: http://localhost/api/v1/projects?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  from: 1
                  last_page: 1
                  per_page: 15
                  to: 1
                  total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Projects
      summary: Create a new project master
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - requester_name
              - requester_department_id
              - primary_pic_id
              - due_date
              properties:
                name:
                  type: string
                  example: MES Machine Telemetry v2
                description:
                  type: string
                  example: Integration of factory floor PLC machines to DISS real-time
                    telemetry dashboard.
                requester_name:
                  type: string
                  example: Pak Budi
                requester_department_id:
                  type: integer
                  example: 2
                primary_pic_id:
                  type: integer
                  example: 1
                priority:
                  $ref: '#/components/schemas/ProjectPriority'
                start_date:
                  type: string
                  format: date
                  example: '2026-10-15'
                due_date:
                  type: string
                  format: date
                  example: '2026-12-31'
      responses:
        '201':
          description: Project successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: Project created successfully
                data:
                  id: a2f66269-31f8-4867-b748-bbac05ddfa18
                  project_code: IT-2026-0001
                  name: MES Machine Telemetry v2
                  description: Integration of factory floor PLC machines to DISS real-time
                    telemetry dashboard.
