                  deadline_extension_count: 0
                  requester_name: Pak Budi
                  department:
                    id: 2
                    name: Molding Production
                    code: MOLD
                  pic:
                    id: 1
                    name: Raymond Lay
                    email: raymondlay023@gmail.com
                    employee_id: EMP-001
                  created_at: '2026-10-14T08:00:00Z'
                  updated_at: '2026-10-14T08:00:00Z'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Validation failed
                errors:
                  due_date:
                  - The due date must be a date after or equal to start date.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{id}:
    get:
      tags:
      - Projects
      summary: Get complete project detail (Composite)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Project composite detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: Project details retrieved successfully
                data:
                  id: a2f66269-31f8-4867-b748-bbac05ddfa18
