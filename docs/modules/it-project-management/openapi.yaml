components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token
      description: 'Laravel Sanctum personal access token passed as ''Authorization:
        Bearer <token>'''
  responses:
    Unauthorized:
      description: Authentication token missing, invalid, or expired
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthenticated.
          example:
            message: Unauthenticated.
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Resource not found
          example:
            success: false
            message: Project not found
    ValidationError:
      description: Validation or domain rule constraint failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Validation failed
            errors:
              field_name:
              - The field is required.
  schemas:
    StandardEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
      required:
      - success
      - message
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            due_date:
            - The due date must be a date after or equal to start date.
      required:
      - success
      - message
    UserMinimal:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Raymond Lay
        email:
          type: string
          format: email
          example: raymondlay023@gmail.com
        employee_id:
          type: string
          nullable: true
          example: EMP-001
    DepartmentMinimal:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Information Technology
        code:
          type: string
          example: IT
    ProjectPriority:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
      example: HIGH
    ProjectStage:
      type: string
      enum:
      - DRAFT
      - INITIATION
      - PLANNING
      - DEVELOPMENT
      - MONITORING
      - REVIEW
      - CLOSURE
      example: DEVELOPMENT
    ProjectStatus:
      type: string
      enum:
      - ACTIVE
      - ON_HOLD
      - CANCELLED
      - COMPLETED
      example: ACTIVE
    KpiHealthStatus:
      type: string
      enum:
      - ON_TRACK
      - AT_RISK
      - OVERDUE
      - ON_HOLD
      - CANCELLED
      - ON_TIME
      - LATE
      example: ON_TRACK
    CheckpointStatus:
      type: string
      enum:
      - PENDING
      - COMPLETED
      - SKIPPED
      example: PENDING
    ExtensionReasonCategory:
      type: string
      enum:
      - SCOPE_CHANGE
      - VENDOR_DELAY
      - MANAGEMENT_PREEMPTION
      - PAUSE_EXTENSION
      - OTHER
      example: SCOPE_CHANGE
    CancellationCategory:
      type: string
      enum:
      - REQUESTER_DEPEN_DEP_PRIORITIZED
      - BUDGET_CUT
      - TECHNICAL_INFEASIBILITY
      - DUPLICATE
      - OTHER
      example: REQUESTER_DEPEN_DEP_PRIORITIZED
    ProjectResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a2f66269-31f8-4867-b748-bbac05ddfa18
        project_code:
          type: string
          example: IT-2026-0001
        name:
          type: string
          example: MES Machine Telemetry v2
        description:
          type: string
          nullable: true
          example: Integration of factory floor PLC machines to DISS real-time telemetry
            dashboard.
        priority:
          $ref: '#/components/schemas/ProjectPriority'
        stage:
