                  department:
                    id: 2
                    name: Molding Production
                    code: MOLD
                  pic:
                    id: 1
                    name: Raymond Lay
                    email: raymondlay023@gmail.com
                    employee_id: EMP-001
                  created_at: '2026-10-14T08:00:00Z'
                  updated_at: '2026-10-14T10:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Projects
      summary: Soft delete a project
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Project soft deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: Project deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{id}/transition-stage:
    post:
      tags:
      - Workflow
      summary: Advance or revert project stage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - target_stage
              properties:
                target_stage:
                  $ref: '#/components/schemas/ProjectStage'
                  example: INITIATION
                is_override:
                  type: boolean
                  default: false
                reason:
                  type: string
                  nullable: true
                  example: null
      responses:
        '200':
          description: Stage successfully transitioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: Project transitioned to INITIATION successfully
                data:
                  id: a2f66269-31f8-4867-b748-bbac05ddfa18
                  stage: INITIATION
                  status: ACTIVE
        '422':
          description: Invalid stage transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Invalid stage transition from DRAFT to CLOSURE.
                errors:
                  target_stage:
                  - Stage cannot skip sequential pipeline without override flag.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{id}/hold:
    post:
      tags:
      - Workflow
      summary: Put active project On-Hold
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  example: Awaiting PLC spare part shipment from vendor overseas.
      responses:
        '200':
          description: Project placed on hold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: Project placed on hold successfully
                data:
                  id: a2f66269-31f8-4867-b748-bbac05ddfa18
                  status: ON_HOLD
                  paused_at: '2026-10-14T11:00:00Z'
                  hold_reason: Awaiting PLC spare part shipment from vendor overseas.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{id}/resume:
    post:
      tags:
      - Workflow
      summary: Resume On-Hold project back to ACTIVE
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                extend_due_date:
                  type: boolean
                  default: true
                  description: Auto-extend due date by pause duration
      responses:
        '200':
          description: Project resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: Project resumed successfully
                data:
                  id: a2f66269-31f8-4867-b748-bbac05ddfa18
                  status: ACTIVE
                  due_date: '2027-01-05'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{id}/cancel:
    post:
      tags:
      - Workflow
      summary: Cancel project with structured reason category
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason_category
              - notes
              properties:
                reason_category:
                  $ref: '#/components/schemas/CancellationCategory'
                notes:
                  type: string
                  example: Requester department postponed automation to next fiscal
                    year.
      responses:
        '200':
          description: Project cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: Project cancelled successfully
                data:
                  id: a2f66269-31f8-4867-b748-bbac05ddfa18
                  status: CANCELLED
                  cancelled_at: '2026-10-14T11:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{id}/approve-closure:
    post:
      tags:
      - Workflow
      summary: Approve Review -> Closure transition (Enforces completion gate)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comments:
                  type: string
                  example: All deliverables and machine telemetry integration verified.
      responses:
        '200':
          description: Project closure approved and marked COMPLETED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: Project closure approved successfully
                data:
                  id: a2f66269-31f8-4867-b748-bbac05ddfa18
                  stage: CLOSURE
                  status: COMPLETED
                  finished_date: '2026-12-20'
                  progress_percent: 100.0
        '422':
          description: Gate violation (Required checkpoints incomplete)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: 'Cannot close project: Checkpoint ''Architecture & Network
                  Diagram Sign-Off'' is not completed.'
                errors:
                  closure_gate:
                  - 1 required checkpoint remains incomplete.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{id}/reject-closure:
    post:
      tags:
      - Workflow
      summary: Reject closure and return project to DEVELOPMENT
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
