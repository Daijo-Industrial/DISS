    put:
      tags:
      - Projects
      summary: Update project metadata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: MES Machine Telemetry v2.1
                description:
                  type: string
                  example: Updated scope including second line sensors.
                priority:
                  $ref: '#/components/schemas/ProjectPriority'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnvelope'
              example:
                success: true
                message: Project updated successfully
                data:
                  id: a2f66269-31f8-4867-b748-bbac05ddfa18
                  project_code: IT-2026-0001
                  name: MES Machine Telemetry v2.1
                  description: Updated scope including second line sensors.
