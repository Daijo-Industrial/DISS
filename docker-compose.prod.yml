services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8000}:80'
    volumes:
      - ./docker/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - diss_prod_storage:/var/www/html/storage:ro
      - diss_prod_public_build:/var/www/html/public/build:ro
    depends_on:
      - app
    networks:
      - diss-prod-network

  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    image: diss-prod-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: '${APP_DEBUG:-false}'
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_SERVER_HOST: 127.0.0.1
      REVERB_SERVER_PORT: 8080
    volumes:
      - diss_prod_storage:/var/www/html/storage
      - diss_prod_public_build:/var/www/html/public/build
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - diss-prod-network

  mysql:
    image: 'mysql:8.4'
    restart: unless-stopped
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_DATABASE: '${DB_DATABASE:-laravel}'
      MYSQL_USER: '${DB_USERNAME:-sail}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 0
    volumes:
      - diss_prod_mysql:/var/lib/mysql
    networks:
      - diss-prod-network
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-p${DB_PASSWORD:-password}'
      retries: 5
      timeout: 5s

  redis:
    image: 'redis:alpine'
    restart: unless-stopped
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - diss_prod_redis:/data
    networks:
      - diss-prod-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 5
      timeout: 5s

networks:
  diss-prod-network:
    driver: bridge

volumes:
  diss_prod_mysql:
    driver: local
  diss_prod_redis:
    driver: local
  diss_prod_storage:
    driver: local
  diss_prod_public_build:
    driver: local
